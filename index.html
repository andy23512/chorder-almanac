<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chorder's Almanac</title>
    <meta
      name="description"
      content="A daily almanac for CharaChorder users: the day's Do / Don't for chorders, a lucky fortune, and moments from typing history."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chorder's Almanac" />
    <meta
      property="og:description"
      content="A daily almanac for CharaChorder users: the day's Do / Don't for chorders, a lucky fortune, and moments from typing history."
    />
    <meta property="og:url" content="https://andy23512.github.io/chorder-almanac/" />
    <meta property="og:image" content="https://andy23512.github.io/chorder-almanac/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chorder's Almanac" />
    <meta
      name="twitter:description"
      content="A daily almanac for CharaChorder users: the day's Do / Don't for chorders, a lucky fortune, and moments from typing history."
    />
    <meta name="twitter:image" content="https://andy23512.github.io/chorder-almanac/og-image.png" />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
