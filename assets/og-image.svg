<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <radialGradient id="bg" cx="20%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#efe4d2"/>
      <stop offset="70%" stop-color="#e2d3ba"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- design is vertically centered in the 1200 square so a center-crop to 1200x630 frames it -->
  <g transform="translate(0,285)">
  <!-- paper sheet -->
  <rect x="60" y="50" width="1080" height="530" rx="20" fill="#f4ece0" stroke="#e7dbc7" stroke-width="2"/>
  <rect x="80" y="70" width="1040" height="490" rx="12" fill="none" stroke="#d8c9b0" stroke-width="2"/>

  <!-- header rule -->
  <line x1="110" y1="230" x2="1090" y2="230" stroke="#b5231f" stroke-width="4"/>

  <!-- brand -->
  <text x="112" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#8f1a17" letter-spacing="3">CHORDER’S</text>
  <text x="112" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#8f1a17" letter-spacing="6">ALMANAC</text>

  <!-- anchor mark -->
  <g stroke="#b58a33" stroke-width="7" stroke-linecap="round" fill="none" transform="translate(1000,90)">
    <circle cx="40" cy="18" r="9" fill="#b58a33" stroke="none"/>
    <line x1="40" y1="27" x2="40" y2="92"/>
    <line x1="14" y1="44" x2="66" y2="44"/>
    <path d="M6 66 a34 34 0 0 0 68 0"/>
  </g>

  <!-- tagline -->
  <text x="112" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#2b2320">A daily almanac for CharaChorder users</text>

  <!-- DO / DON'T chips -->
  <rect x="112" y="370" width="120" height="56" rx="28" fill="#2f6b41"/>
  <text x="172" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="1">DO</text>
  <rect x="252" y="370" width="170" height="56" rx="28" fill="#b5231f"/>
  <text x="337" y="408" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="1">DON’T</text>

  <!-- feature line -->
  <text x="112" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#6a5c50">The day’s Do / Don’t · a lucky fortune · a moment from typing history</text>

  <!-- url -->
  <text x="112" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#b58a33" letter-spacing="1">andy23512.github.io/chorder-almanac</text>
  </g>
</svg>
